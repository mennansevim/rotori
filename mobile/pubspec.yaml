name: japan_trip
description: Japan-Trip mobil ve web istemcisi (Flutter + Supabase).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Backend
  supabase_flutter: ^2.5.6
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.7
  # Offline yerel cache (Faz 4)
  shared_preferences: ^2.3.0
  # Online/offline durumu (arka planda otomatik senkron)
  connectivity_plus: ^6.0.5
  # GPS konum akışı (keşif haritası geofence'leri)
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
