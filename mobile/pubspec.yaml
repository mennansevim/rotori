name: japan_trip
description: Japan-Trip mobil ve web istemcisi (Flutter + Supabase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Çok dilli (i18n) — Material/Cupertino yerelleştirme delegeleri.
  flutter_localizations:
    sdk: flutter
  # Backend
  supabase_flutter: ^2.5.6
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.7
  # Offline yerel cache (Faz 4)
  shared_preferences: ^2.3.0
  # Online/offline durumu (arka planda otomatik senkron)
  connectivity_plus: ^6.0.5
  # GPS konum akışı (keşif haritası geofence'leri)
  geolocator: ^14.0.3
  # Harita/dış bağlantı açma (yer detayı "haritada aç")
  url_launcher: ^6.3.1
  # Bilet fotoğrafı çekme/seçme (kamera + galeri)
  image_picker: ^1.1.2
  # Cihaz üstü (on-device) OCR — bilet metnini çıkarır (yalnızca mobil).
  # Web derlemesine sızmaması için ticket_ocr.dart koşullu import ile izole edilir.
  google_mlkit_text_recognition: ^0.15.0
  # Yerel bildirim (bilet açılış hatırlatmaları) — mobilde çalışır, web'de no-op.
  flutter_local_notifications: ^17.2.3
  # Zaman dilimi verisi (schedule için gerekli)
  timezone: ^0.9.4
  # Modern ikon seti (emoji yerine tutarlı görsel dil)
  lucide_icons_flutter: ^3.1.14+2
  # Uygulama içi interaktif harita (OpenStreetMap raster tile — API key yok).
  # Gün rotasını numaralı pinlerle çizer; mobil + web derlemesinde çalışır.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # HTTP istemcisi — Open-Meteo hava durumu (anahtar yok); web + mobilde çalışır.
  http: ^1.2.0
  # Çevrimdışı harita tile cache — DefaultCacheManager iOS/Android'de dosya
  # tabanlı, web'de kIsWeb kapısıyla devre dışı (day_map_screen.dart NetworkImage'e
  # düşer). Kullanıcı bir günün haritasını çevrimiçi görüntülediğinde tile'lar
  # yerel cache'e yazılır; sonraki açılışlarda ağ olmasa bile aynı kareler yüklenir.
  flutter_cache_manager: ^3.4.1
  # Sign in with Apple — iOS/macOS native token akışı (App Store şartı).
  # Web'de paketin kendi web implementasyonu var; UI butonu yine de platform
  # gate'i ile yalnızca iOS/macOS'ta gösterilir (auth_screen.dart).
  sign_in_with_apple: ^6.1.3
  # Nonce SHA-256 hash'i — Apple isteğine hashed, Supabase'e raw nonce gider.
  crypto: ^3.0.3
  # iOS Home Screen widget'ına veri gönderir (App Group üzerinden UserDefaults'a
  # yazar) ve widget'ı yeniden yükletir. Web derlemesinde no-op'tur — kIsWeb
  # gate'i + try/catch ile home_widget_hook.dart sessiz düşer.
  # Native Xcode Widget Extension target'ı manuel oluşturulur; kurulum:
  # docs/IOS_WIDGET_SETUP.md.
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
