<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotori Test Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #111827;
      --panel-2: #0f172a;
      --line: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --ok: #22c55e;
      --fail: #ef4444;
      --warn: #f59e0b;
      --info: #38bdf8;
      --accent: #7c6aef;
      --pill: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { margin: 0 0 4px; font-size: 1.55rem; }
    .sub { color: var(--muted); margin-bottom: 14px; font-size: 0.92rem; }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
    }
    button:hover:not(:disabled) { border-color: #334155; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 0.88rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .k { color: var(--muted); font-size: 0.82rem; }
    .v { font-size: 1.45rem; font-weight: 700; margin-top: 4px; }
    .ok { color: var(--ok); }
    .fail { color: var(--fail); }
    .warn { color: var(--warn); }
    .section {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .pill {
      background: var(--pill);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.76rem;
      white-space: nowrap;
    }
    .pill.ok { color: var(--ok); border-color: rgba(34,197,94,.4); }
    .pill.fail { color: var(--fail); border-color: rgba(239,68,68,.4); }
    details { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
    summary { cursor: pointer; color: var(--info); user-select: none; font-size: 0.92rem; }
    summary:hover { color: #93c5fd; }
    ul { margin: 8px 0 0 18px; padding: 0; }
    li { margin-bottom: 4px; font-size: 0.9rem; }
    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      color: #cbd5e1;
      word-break: break-word;
    }
    .empty { color: var(--muted); font-size: 0.9rem; }
    .err {
      background: #2a1012;
      border: 1px solid #5e1f26;
      color: #fecaca;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 6px;
      white-space: pre-wrap;
      font-size: 0.82rem;
    }
    .suite {
      border-top: 1px dashed var(--line);
      padding: 8px 0 4px;
    }
    .suite:first-of-type { border-top: 0; padding-top: 4px; }
    .suite-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      cursor: pointer;
    }
    .suite-head:hover { color: #93c5fd; }
    .suite-title { flex: 1; }
    .suite-count { color: var(--muted); font-size: 0.82rem; }
    .test-list { display: none; margin: 6px 0 4px 12px; padding-left: 0; }
    .test-list.open { display: block; }
    .test-list li {
      list-style: none; padding: 2px 0; display: flex; gap: 8px; align-items: baseline;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.ok { background: var(--ok); }
    .dot.fail { background: var(--fail); }
    .dot.skip { background: var(--warn); }
    .test-name { flex: 1; color: var(--text); font-size: 0.86rem; }
    .test-dur { color: var(--muted); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
    #logPanel {
      background: #000; border: 1px solid var(--line); border-radius: 10px;
      color: #d1d5db; font-family: ui-monospace, Menlo, monospace;
      font-size: 0.78rem; line-height: 1.4;
      padding: 10px; max-height: 300px; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      margin-bottom: 12px; display: none;
    }
    #logPanel.on { display: block; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .status-dot.idle { background: var(--muted); }
    .status-dot.run { background: var(--warn); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Rotori Test Dashboard</h1>
    <div class="sub">Flutter suite + QA senaryoları + Integration sözleşme testleri — tek panelden izle ve tetikle.</div>

    <div class="toolbar">
      <button id="runBtn" class="primary">▶ Testleri Koştur</button>
      <button id="simBtn">🖥️ Önizleme (device_preview)</button>
      <button id="simStopBtn" style="display:none">⏹ Önizlemeyi Durdur</button>
      <button id="refreshBtn">↻ Sadece Verileri Yenile</button>
      <button id="toggleLogBtn">📜 Log</button>
      <span class="meta"><span id="statusDot" class="status-dot idle"></span><span id="lastUpdated">Yükleniyor…</span></span>
    </div>

    <pre id="logPanel"></pre>

    <div class="grid" id="summaryGrid"></div>

    <div class="section" id="flutterSection"></div>
    <div class="section" id="uiflowSection"></div>
    <div class="section" id="qaSection"></div>
    <div class="section" id="integrationSection"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const fmtTime = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? v : d.toLocaleString('tr-TR');
    };
    const pct = (p, t) => t ? Math.round((p / t) * 100) : 0;
    const cls = (failed) => failed > 0 ? 'fail' : 'ok';
    const escape = (s) => String(s).replace(/[&<>'"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

    const suiteFromFlutter = (f) => {
      const s = f?.summary || {};
      return {
        total: +(s.total || 0), passed: +(s.passed || 0),
        failed: +(s.failed || 0), skipped: +(s.skipped || 0),
      };
    };
    const suiteFromQA = (f) => {
      const r = Array.isArray(f?.results) ? f.results : [];
      return {
        total: r.length,
        passed: r.filter(x => x.status === 'pass').length,
        failed: r.filter(x => x.status === 'fail').length,
        skipped: 0,
      };
    };

    const summaryCard = (title, s) => `
      <div class="card">
        <div class="k">${title}</div>
        <div class="v ${cls(s.failed)}">${s.passed}/${s.total}</div>
        <div class="k">Başarı %${pct(s.passed, s.total)} · Kalan <span class="${cls(s.failed)}">${s.failed}</span>${s.skipped ? ` · Skip ${s.skipped}` : ''}</div>
      </div>`;

    const suiteBlock = (suite) => {
      const tests = Array.isArray(suite.tests) ? suite.tests : [];
      const failedFirst = [...tests].sort((a, b) => (a.status === 'fail' ? -1 : 1));
      const items = failedFirst.map(t => `
        <li>
          <span class="dot ${t.status === 'pass' ? 'ok' : t.status === 'fail' ? 'fail' : 'skip'}"></span>
          <span class="test-name">${escape(t.name)}</span>
          <span class="test-dur">${t.durationMs != null ? t.durationMs + ' ms' : ''}</span>
        </li>
        ${t.status === 'fail' && t.error ? `<li><div class="err">${escape(t.error)}</div></li>` : ''}
      `).join('');
      const statusPill = suite.failed > 0
        ? `<span class="pill fail">${suite.failed} FAIL</span>`
        : `<span class="pill ok">${suite.passed} ✓</span>`;
      return `
        <div class="suite">
          <div class="suite-head" onclick="this.nextElementSibling.classList.toggle('open')">
            <span class="suite-title mono">${escape(suite.path)}</span>
            <span class="suite-count">${suite.passed}/${suite.total}${suite.skipped ? ' (+' + suite.skipped + ' skip)' : ''} · ${suite.durationMs || 0} ms</span>
            ${statusPill}
          </div>
          <ul class="test-list">${items || '<li class="empty">test yok</li>'}</ul>
        </div>`;
    };

    const renderFlutter = (sec, file) => {
      if (!file) {
        sec.innerHTML = `<h2>Flutter Suite <span class="pill">veri yok</span></h2>
          <div class="empty">qa/flutter-tests.json yok — "Testleri Koştur"a bas.</div>`;
        return;
      }
      const s = suiteFromFlutter(file);
      const suites = (file.suites || []).slice().sort((a, b) => (a.failed === 0 ? 1 : -1));
      sec.innerHTML = `
        <h2>Flutter Suite <span class="pill ${cls(s.failed)}">${s.passed}/${s.total} geçti</span></h2>
        <div class="meta">Üretildi: ${fmtTime(file.generatedAt)} · Süre: ${file.durationMs ?? '—'} ms · ${suites.length} dosya</div>
        <details open><summary>Suite listesi (${suites.length})</summary>
          <div>${suites.map(suiteBlock).join('')}</div>
        </details>`;
    };

    const renderQA = (sec, file) => {
      if (!file) {
        sec.innerHTML = `<h2>QA Senaryoları <span class="pill">veri yok</span></h2>
          <div class="empty">qa/latest-run.json yok.</div>`;
        return;
      }
      const s = suiteFromQA(file);
      const results = (file.results || []).slice().sort((a, b) => (a.status === 'fail' ? -1 : 1));
      const items = results.map(r => `
        <li>
          <span class="dot ${r.status === 'pass' ? 'ok' : r.status === 'fail' ? 'fail' : 'skip'}"></span>
          <span class="test-name mono">${escape(r.id)}</span>
          <span class="test-dur">${r.durationMs != null ? r.durationMs + ' ms' : ''}</span>
        </li>
        ${r.status === 'fail' && r.error ? `<li><div class="err">${escape(r.error)}</div></li>` : ''}
      `).join('');
      sec.innerHTML = `
        <h2>QA Senaryoları <span class="pill ${cls(s.failed)}">${s.passed}/${s.total} geçti</span></h2>
        <div class="meta">Başlangıç: ${fmtTime(file.startedAt)} · Bitiş: ${fmtTime(file.completedAt)}</div>
        <details><summary>Senaryo listesi (${results.length})</summary>
          <ul class="test-list open">${items}</ul>
        </details>`;
    };

    const renderIntegration = (sec, file) => {
      if (!file) {
        sec.innerHTML = `<h2>Integration <span class="pill">veri yok</span></h2>
          <div class="empty">qa/integration-run.json yok.</div>`;
        return;
      }
      const s = suiteFromFlutter(file);
      const suites = file.suites || [];
      sec.innerHTML = `
        <h2>Integration (Contract) <span class="pill ${cls(s.failed)}">${s.passed}/${s.total} geçti</span></h2>
        <div class="meta">Üretildi: ${fmtTime(file.generatedAt)}</div>
        <details open><summary>Test listesi</summary>
          <div>${suites.map(suiteBlock).join('')}</div>
        </details>`;
    };

    const renderUiflow = (sec, file) => {
      if (!file) {
        sec.innerHTML = `<h2>UI Otomasyon <span class="pill">veri yok</span></h2>
          <div class="empty">qa/uiflow-run.json yok — "Testleri Koştur"a bas.</div>`;
        return;
      }
      const s = suiteFromFlutter(file);
      const suites = file.suites || [];
      sec.innerHTML = `
        <h2>UI Otomasyon (Gesture) <span class="pill ${cls(s.failed)}">${s.passed}/${s.total} geçti</span></h2>
        <div class="meta">Gerçek kullanıcı jestleri (tap / enterText / navigate) · Üretildi: ${fmtTime(file.generatedAt)}</div>
        <details open><summary>Test listesi (${s.total})</summary>
          <div>${suites.map(suiteBlock).join('')}</div>
        </details>`;
    };

    const fetchJson = async (path) => {
      try {
        const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
        return r.ok ? await r.json() : null;
      } catch { return null; }
    };

    const loadDashboard = async () => {
      const [flutter, qa, integration, uiflow] = await Promise.all([
        fetchJson('flutter-tests.json'),
        fetchJson('latest-run.json'),
        fetchJson('integration-run.json'),
        fetchJson('uiflow-run.json'),
      ]);
      const fs = suiteFromFlutter(flutter || {});
      const qs = suiteFromQA(qa || {});
      const is = suiteFromFlutter(integration || {});
      const us = suiteFromFlutter(uiflow || {});
      const total = {
        total: fs.total + qs.total + is.total + us.total,
        passed: fs.passed + qs.passed + is.passed + us.passed,
        failed: fs.failed + qs.failed + is.failed + us.failed,
        skipped: fs.skipped + qs.skipped + is.skipped + us.skipped,
      };
      $('summaryGrid').innerHTML = [
        summaryCard('Toplam', total),
        summaryCard('Flutter Suite', fs),
        summaryCard('UI Otomasyon', us),
        summaryCard('QA Senaryoları', qs),
        summaryCard('Integration', is),
      ].join('');
      renderFlutter($('flutterSection'), flutter);
      renderUiflow($('uiflowSection'), uiflow);
      renderQA($('qaSection'), qa);
      renderIntegration($('integrationSection'), integration);
      const stamps = [flutter?.generatedAt, qa?.completedAt, integration?.generatedAt, uiflow?.generatedAt].filter(Boolean).sort();
      $('lastUpdated').textContent = 'Son güncelleme: ' + (stamps.length ? fmtTime(stamps[stamps.length - 1]) : '—');
    };

    const setRunning = (on) => {
      $('runBtn').disabled = on;
      $('refreshBtn').disabled = on;
      $('statusDot').className = 'status-dot ' + (on ? 'run' : 'idle');
    };

    const appendLog = (text) => {
      const el = $('logPanel');
      el.classList.add('on');
      el.textContent += text;
      el.scrollTop = el.scrollHeight;
    };

    const runTests = async () => {
      setRunning(true);
      $('logPanel').textContent = '';
      appendLog('▶ refresh-dashboard.sh başlatılıyor…\n\n');
      try {
        const resp = await fetch('/run', { method: 'POST' });
        if (!resp.ok) {
          appendLog(`\n[hata] HTTP ${resp.status} — server çalışıyor mu? (python3 qa/dashboard_server.py)\n`);
          setRunning(false);
          return;
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          appendLog(dec.decode(value, { stream: true }));
        }
        appendLog('\n✓ tamamlandı — dashboard yenileniyor…\n');
      } catch (e) {
        appendLog(`\n[bağlantı hatası] ${e.message}\n` +
          'Sunucu ayakta değil. Şu komutla başlat:\n' +
          '  cd mobile && python3 qa/dashboard_server.py\n');
      } finally {
        await loadDashboard();
        setRunning(false);
      }
    };

    $('runBtn').addEventListener('click', runTests);
    $('refreshBtn').addEventListener('click', () => loadDashboard());
    $('toggleLogBtn').addEventListener('click', () => $('logPanel').classList.toggle('on'));

    // ── Simülatör (flutter run) tetikleme ──────────────────────────────
    let simReader = null;
    const setSimRunning = (on) => {
      $('simBtn').style.display = on ? 'none' : '';
      $('simStopBtn').style.display = on ? '' : 'none';
    };

    const runSimulator = async () => {
      setSimRunning(true);
      $('logPanel').classList.add('on');
      appendLog('\n🖥️ device_preview (Chrome) başlatılıyor…\n\n');
      try {
        const resp = await fetch('/simulator', { method: 'POST' });
        if (!resp.ok) {
          const msg = resp.status === 409
            ? 'zaten çalışıyor'
            : `HTTP ${resp.status} — server çalışıyor mu?`;
          appendLog(`\n[hata] ${msg}\n`);
          setSimRunning(false);
          return;
        }
        simReader = resp.body.getReader();
        const dec = new TextDecoder();
        while (true) {
          const { value, done } = await simReader.read();
          if (done) break;
          appendLog(dec.decode(value, { stream: true }));
        }
        appendLog('\n✓ flutter run sonlandı.\n');
      } catch (e) {
        appendLog(`\n[bağlantı hatası] ${e.message}\n` +
          'Sunucu ayakta değil. Şu komutla başlat:\n' +
          '  cd mobile && python3 qa/dashboard_server.py\n');
      } finally {
        simReader = null;
        setSimRunning(false);
      }
    };

    const stopSimulator = async () => {
      appendLog('\n⏹ Durduruluyor…\n');
      try {
        await fetch('/simulator/stop', { method: 'POST' });
      } catch (e) {
        appendLog(`\n[hata] ${e.message}\n`);
      }
    };

    $('simBtn').addEventListener('click', runSimulator);
    $('simStopBtn').addEventListener('click', stopSimulator);

    loadDashboard();
  </script>
</body>
</html>
