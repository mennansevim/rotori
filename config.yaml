paths:
  video_source_dir: "/Users/sevimm/Documents/Japonya"
  frames_dir: "data/frames"
  metadata_csv: "data/metadata.csv"
  plans_dir: "data/kurgu_planlari"
  output_dir: "output/reels"
  ready_dir: "output/ready_to_publish"

ollama:
  base_url: "http://localhost:11434"
  vision_model: "llava:7b"
  text_model: "qwen2.5:3b"
  request_timeout_sn: 240
  vision_concurrency: 1

dify:
  base_url: "http://192.168.1.60:5001"
  api_key: "app-JgsLpkZK8Q8L2FxV1DHmJkIV"
  workflow_endpoint: "/v1/workflows/run"
  concurrency: 2
  timeout_sn: 180
  aciklama_tipi: "aciklayici"    # aciklayici | bolgeyi_tanit | merak_uyandir

openai:
  api_key: "***REMOVED-OPENAI-KEY***"    # sk-... ile başlar
  model: "gpt-4o-mini"                # gpt-4o-mini | gpt-4o | gpt-4.1-mini
  base_url: "https://api.openai.com/v1"
  timeout_sn: 60

instagram:
  # Yayına Hazır reel'lerini Instagram uygulaması Drafts sekmesine gönderir.
  # instagrapi kullanır (unofficial Python client) — hesabı riske sokabilir
  # (Instagram TOS "3rd-party client" yasaklıyor). Şahsi kanal + haftada
  # birkaç upload için tolere edilebilir. Alternatif Meta Graph API'de Drafts
  # desteklenmiyor (sadece direct publish).
  username: "REPLACE_ME_USERNAME"
  password: "REPLACE_ME_PASSWORD"
  # 2FA authenticator app aktifse: uygulama içi "Elle Setup" barkodunun
  # altındaki 16 karakterlik secret'i buraya yaz. SMS 2FA veya 2FA yoksa boş.
  totp_secret: ""
  session_file: "data/instagram_session.json"
  uploads_log: "data/instagram_uploads.jsonl"

stories:
  # Hikaye Görsel Üreticisi (Instagram Story kartları). GPT ile 3 farklı
  # varyant üretir, arşivden mekana uygun arka plan seçer, PIL ile render.
  output_dir: "output/stories"
  width: 1080
  height: 1920
  handle: "@mennansjapan"        # her karta alt-üst köşede sabit badge

reels:
  target_width: 1080
  target_height: 1920
  fps: 30
  min_duration_sn: 30
  max_duration_sn: 60
  clip_per_reel: 4
  crossfade_sn: 0.3
  hook_duration_sn: 3.0
  cta_duration_sn: 3.0
  cta_text: "Takip et 👉 @japanreels"
  font: "/System/Library/Fonts/Supplemental/Impact.ttf"
  font_alt: "/System/Library/Fonts/Supplemental/Arial Black.ttf"
  shadow_offset: 6
  stroke_width: 8
  # Footer: her reel'de sabit alt imza. Video boyunca sabittir, küçük punto,
  # alta yakın konum. Kanal handle'ı için idealdir. Boş bırakırsan footer basılmaz.
  footer_text: "@mennansjapan"
  # Video üzerine yazı basılsın mı? False = temiz video (kullanıcı Instagram'da
  # yazı kendi ekler). True = hook + footer video'ya gömülür.
  add_overlays: false

pilot:
  pilot_mode: false
  pilot_count: 10
  random_seed: 42

run:
  # Tek çalıştırmada işlenecek MAKSİMUM video sayısı (güvenlik sınırı).
  # "Tümünü çalıştır" yok; her step1 çalışması en fazla bu kadar yeni video işler.
  max_videos_per_run: 10
