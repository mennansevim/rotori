<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d80b09" />
  <title>Rotori Social · İçerik Çalışma Alanı</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/rotori-icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/rotori-icon-180.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/dashboard/styles.css?v=20260821-1" />
</head>
<body>
  <div class="layout">
    <!-- Mobil üst bar -->
    <div class="topbar-mobile">
      <button class="hamburger" id="hamburger" aria-label="Menüyü aç">
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <img class="brand__mark" src="/static/icons/rotori-icon-192.png" width="32" height="32" alt="" />
      <span class="brand__text"><span class="brand__title">Rotori Social</span></span>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img class="brand__mark" src="/static/icons/rotori-icon-192.png" width="32" height="32" alt="" />
        <div class="brand__text">
          <div class="brand__title">Rotori Social</div>
          <div class="brand__sub">İçerik çalışma alanı</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Ana menü"></nav>
      <div class="account" id="account" role="button" tabindex="0" aria-label="Hesap ayarlarını aç">
        <div class="account__label">Bağlı Hesap</div>
        <div class="account__row">
          <div class="account__avatar">JR</div>
          <div>
            <div class="account__name" id="acc-name">@japonyaruyasi</div>
            <div class="account__status"><span class="dot" id="acc-dot"></span><span id="acc-state">Kontrol ediliyor…</span></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- İçerik -->
    <main class="main" id="main">
      <header class="topbar" aria-label="Çalışma alanı araç çubuğu">
        <div class="topbar__workspace">
          <span class="topbar__workspace-mark">IG</span>
          <span>
            <strong>Japonya Rüyası</strong>
            <small>İçerik çalışma alanı</small>
          </span>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--primary topbar__create" id="top-create"><span aria-hidden="true">＋</span> Yeni İçerik</button>
          <button class="topbar__profile" id="top-profile" aria-label="Hesap ayarlarını aç"><span>JR</span></button>
        </div>
      </header>
      <div id="page-root"></div>
    </main>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modal-root"></div>

  <script src="/static/dashboard/app.js?v=20260821-1" type="module"></script>
</body>
</html>
