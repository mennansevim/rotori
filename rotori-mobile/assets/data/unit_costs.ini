; Rotori — Japonya birim maliyet tablosu (2026)
; ---------------------------------------------------------------------------
; KAYNAK ÖNCELİĞİ: Uygulama önce Supabase `unit_costs` tablosunu okur (uzaktan
; güncellenebilir), başarılı çekimi cache'ler. Bu INI yalnızca OFFLINE / erişim
; yoksa devreye giren yerel yedektir. Kalıcı değişiklik için Supabase'i güncelle;
; migration: supabase/migrations/0007_unit_costs.sql.
;
; Tüm değerler JPY (yen) cinsindendir. Uygulama AI KULLANMADAN doğrudan bu
; tablodan hesaplar. Eksik bırakılan alanlar için gömülü varsayılan kullanılır.
;
; min/max = gerçekçi alt ve üst sınır. Tahmin "min toplam – max toplam" verir.
;
; 2026 kalibrasyonu:
; - Uçuş alt bandı: kampanyalı/Çin aktarmalı ekonomi
; - Uçuş üst bandı: direkt uçuş veya yoğun dönem ekonomi
; - Otel: Tokyo/Osaka, 2 kişilik oda tabanı + ilave kişi
; - Yerel ulaşım: yaklaşık 7-14 günlük tipik gezi toplamı
; ---------------------------------------------------------------------------

[meta]
year = 2026
currency = JPY

; Uçak — kişi başı gidiş-dönüş (Türkiye <-> Japonya, ekonomi).
; adult_min çoğunlukla aktarmalı kampanyalı uçuşu, adult_max ise direkt uçuşu
; veya yoğun sezondaki üst bandı temsil eder.
;
; Güncel örnekler:
; - Aktarmalı: yaklaşık 90000-120000 JPY / kişi
; - Direkt: yaklaşık 175000-220000 JPY / kişi
;
; oneway_factor: tek yön uçuş için yaklaşık çarpan. Tek yön biletler bazı
; firmalarda gidiş-dönüş bilete yakın olabileceğinden yalnızca tahmindir.
[flight]
adult_min = 85000
adult_max = 220000
child_min = 75000
child_max = 190000
oneway_factor = 0.70

; Otel — oda/gece.
; night_* iki kişilik standart oda veya apart tabanıdır.
; extra_person_* üçüncü kişiden itibaren gece başına eklenir.
;
; 3 kişilik Tokyo/Osaka apart otel için gerçekçi toplam:
; yaklaşık 15000-36000 JPY / gece.
[hotel]
night_min = 11000
night_max = 28000
extra_person_min = 3000
extra_person_max = 8000

; Yemek — kişi başı / gün.
; Alt bant: konbini kahvaltısı + uygun öğle yemeği + ekonomik akşam yemeği.
; Üst bant: kafe, restoran, atıştırmalık ve içeceklerin dahil olduğu rahat bütçe.
[food]
adult_min = 3500
adult_max = 9000
child_min = 2000
child_max = 5500

; Tren — kişi başı.
; adult_base_* yaklaşık 7-14 günlük bir gezinin metro, otobüs ve şehir içi
; JR hatlarından oluşan toplam yerel ulaşım bütçesidir.
;
; Her şehirlerarası hızlı tren/shinkansen bacağı için intercity_* ayrıca eklenir.
; child_factor çocuk indirimi (0.5 = yarım ücret).
[train]
adult_base_min = 7000
adult_base_max = 20000
intercity_min = 9000
intercity_max = 24000
child_factor = 0.5

; Taksi — grup / gün.
; Taksi kullanılmayan günler olabileceği için minimum değer 0'dır.
; Üst bant şehir içindeki bir veya iki kısa/orta mesafeli yolculuğu karşılar.
[taxi]
day_min = 0
day_max = 6000

; Alışveriş — kişi başı, tüm gezi.
; Hediyelik, kozmetik, kıyafet, oyuncak ve kişisel alışveriş dahil.
; Elektronik alışveriş bu bölüme değil [electronics] bölümüne yazılır.
[shopping]
adult_min = 10000
adult_max = 60000
child_min = 5000
child_max = 20000

; Elektronik — grup toplam, tüm gezi.
; Opsiyonel kamera, oyun konsolu, saat, kulaklık veya gadget alışverişi.
; Tek bir büyük elektronik ürün 60000 JPY sınırını aşabildiği için üst bant
; yükseltilmiştir.
[electronics]
group_min = 0
group_max = 150000

; Gezi / giriş — kişi başı / gün.
; Müze, tapınak, gözlem terası ve ücretli etkinliklerin günlük ortalaması.
; Üst bant, gezi boyunca bir Disney veya USJ gününün paylaştırılmış etkisini
; kapsayacak şekilde belirlenmiştir.
[attractions]
adult_min = 1000
adult_max = 5500
child_min = 600
child_max = 3500

; Mevsim çarpanı — otel ve uçağa uygulanır.
; Ay bazlı model, Golden Week veya sakura tarihlerini gün seviyesinde ayıramadığı
; için yüksek sezon farkı temkinli biçimde %12 tutulmuştur.
;
; Mayıs ayının tamamı Golden Week kadar pahalı değildir; ancak mevcut model
; yalnızca ay desteklediğinden Mayıs yüksek sezon listesinde kalır.
[season]
high_months = 3,4,5,10,11
high_factor = 1.12
default_factor = 1.0

; Örnek birim fiyatlar (JPY).
; Ekranda "ramen ne kadar, shinkansen ne kadar" referansı olarak gösterilir.
; İstediğini ekleyip çıkarabilirsin.
[reference]
ramen = 1200
sushi_set = 2800
konbini_meal = 850
coffee = 550
subway_ride = 210
taxi_start = 500
shinkansen_tokyo_kyoto = 14170
hotel_night_family = 22000
day_pass = 700
museum = 1500
theme_park = 10500
usj_1day = 8400
disney_1day = 10900