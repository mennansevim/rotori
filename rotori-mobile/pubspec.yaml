name: rotori
description: Japan-Trip mobil ve web istemcisi (Flutter + Supabase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Çok dilli (i18n) — Material/Cupertino yerelleştirme delegeleri.
  flutter_localizations:
    sdk: flutter
  # Backend
  supabase_flutter: ^2.5.6
  # State management
  flutter_riverpod: ^2.5.1
  # Crash, hata ve performans izleme. DSN yoksa tamamen devre dışı kalır;
  # rota/ürün analitiği Sentry'ye değil kendi Supabase tablolarımıza gider.
  sentry_flutter: ^9.25.0
  # Routing
  go_router: ^14.2.7
  # Offline yerel cache (Faz 4)
  shared_preferences: ^2.3.0
  # Online/offline durumu (arka planda otomatik senkron)
  connectivity_plus: ^6.0.5
  # GPS konum akışı (keşif haritası geofence'leri)
  geolocator: ^14.0.3
  # Harita/dış bağlantı açma (yer detayı "haritada aç")
  url_launcher: ^6.3.1
  # Bilet fotoğrafı çekme/seçme (kamera + galeri)
  image_picker: ^1.1.2
  # Cihaz üstü (on-device) OCR — bilet metnini çıkarır (yalnızca mobil).
  # Web derlemesine sızmaması için ticket_ocr.dart koşullu import ile izole edilir.
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: 0.14.1
  # Cihaz üstü metin çevirisi — dil modelleri ilk kullanımda indirilir;
  # sonraki çeviriler internetsiz ve sunucuya metin göndermeden çalışır.
  # Yalnız iOS/Android; web conditional import ile destek-dışı görünür.
  # 0.13.1 mevcut OCR paketinin google_mlkit_commons 0.11.x hattıyla uyumlu.
  google_mlkit_translation: ^0.13.1
  # Canlı kamera akışı — gerçek zamanlı para birimi tarayıcı (yalnızca mobil).
  # Live currency scanner image stream'i buradan gelir; web'de conditional
  # import ile no-op recognizer'a düşer, camera plugin web grafiğine girmez.
  camera: ^0.11.0+2
  # Para hesaplarında double hassasiyet kaybını önlemek için ondalık aritmetik.
  # Kur dönüşümü (1 JPY = X TARGET) ve kart farkı Decimal ile yapılır.
  decimal: ^3.0.2
  # Yerel bildirim (bilet açılış hatırlatmaları) — mobilde çalışır, web'de no-op.
  flutter_local_notifications: ^17.2.3
  # Zaman dilimi verisi (schedule için gerekli)
  timezone: ^0.9.4
  # Modern ikon seti (emoji yerine tutarlı görsel dil)
  lucide_icons_flutter: ^3.1.14+2
  # Uygulama içi interaktif harita (OpenStreetMap raster tile — API key yok).
  # Gün rotasını numaralı pinlerle çizer; mobil + web derlemesinde çalışır.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # HTTP istemcisi — Open-Meteo hava durumu (anahtar yok); web + mobilde çalışır.
  http: ^1.2.0
  # Sign in with Apple — iOS/macOS native token akışı (App Store şartı).
  # Web'de paketin kendi web implementasyonu var; UI butonu yine de platform
  # gate'i ile yalnızca iOS/macOS'ta gösterilir (auth_screen.dart).
  sign_in_with_apple: ^6.1.3
  # Nonce SHA-256 hash'i — Apple isteğine hashed, Supabase'e raw nonce gider.
  crypto: ^3.0.3
  # iOS Home Screen widget'ına veri gönderir (App Group üzerinden UserDefaults'a
  # yazar) ve widget'ı yeniden yükletir. Web derlemesinde no-op'tur — kIsWeb
  # gate'i + try/catch ile home_widget_hook.dart sessiz düşer.
  # Native Xcode Widget Extension target'ı manuel oluşturulur; kurulum:
  # docs/IOS_WIDGET_SETUP.md.
  home_widget: ^0.6.0
  device_preview: ^1.3.1
  audioplayers: ^6.8.1
  # Analytics outbox kayıtları için çakışmasız olay/oturum kimliği.
  uuid: ^4.5.3
  path: ^1.9.1
  path_provider: ^2.1.6
  idb_shim: 2.6.1+7

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  # E2E senaryo koşusu için — mobile/qa/scenarios.json içindeki senaryolar
  # integration_test/scenario_runner_test.dart tarafından koşulur ve
  # mobile/qa/latest-run.json'a çıktı verir. Dashboard bunu okur.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # OpenAI TTS ile önceden üretilmiş Japonca fraz mp3 dosyaları — offline
    # oynatma için. manifest.json içinde jp text → dosya id eşlemesi var.
    - assets/tts/ja/
    # Uygulama içi Rotori marka işareti (torii). Launcher ikonundan türetilmiş
    # 256px kopya — rozet en fazla ~85px çizildiği için 512/1024 paketlemek
    # her kullanıcıya gereksiz bayt maliyeti çıkarır.
    - assets/images/rotori-logo.png
    # Hamburger menüsünün Japonya hero görseli.
    - assets/images/hamb-menu-top-bg.png
    # Tema parkı + teamLab deneyim rehberinin özgün, çevrimdışı hero görseli.
    - assets/images/experience-guide-hero.webp
    # ML Kit çeviri sonuçlarının yanında zorunlu Google Translate atfı.
    - assets/images/powered-by-google-translate.png
    # Yıl bazlı birim maliyet tablosu (bütçe tahmini; elle düzenlenebilir).
    - assets/data/unit_costs.ini

  fonts:
    # Keşif rütbesi kanji glifleri için Noto Sans JP subset (yalnızca
    # 狸狐河童天狗鶴麒麟鳳凰龍旅 — 700 ağırlık, ~6 KB). Her platformda net
    # kanji render'ı; web'deki Noto fallback uyarısını giderir.
    - family: NotoSansJPRank
      fonts:
        - asset: assets/fonts/NotoSansJP-Rank.ttf
          weight: 700

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: rotori
