app:
  description: "Verilen mekan etiketi ve video listesinden Reels için Türkçe hook, overlay metinleri ve CTA üretir."
  icon: "🎬"
  icon_background: "#EFF1F5"
  mode: workflow
  name: "Reels Kurgu Planlayici"
workflow:
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    nodes:
      - data:
          desc: "Kurgu için girdi değişkenleri"
          selected: false
          title: "Start"
          type: start
          variables:
            - label: "Mekan Etiketi"
              max_length: 80
              options: []
              required: true
              type: text-input
              variable: mekan_etiketi
            - label: "Video Dosyaları (virgülle ayrılmış)"
              max_length: 2000
              options: []
              required: true
              type: paragraph
              variable: video_dosyalari
            - label: "Toplam Süre (sn)"
              max_length: 8
              options: []
              required: true
              type: number
              variable: toplam_sure_sn
        height: 154
        id: "start_1"
        position:
          x: 80
          y: 260
        positionAbsolute:
          x: 80
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: "Türkçe hook, overlay, CTA üretir. Sadece JSON döndürür."
          model:
            completion_params:
              temperature: 0.6
              top_p: 0.9
            mode: chat
            name: "qwen2.5:3b"
            provider: ollama
          prompt_template:
            - id: "b0000000-0000-0000-0000-000000000001"
              role: system
              text: |
                Sen deneyimli bir Instagram Reels senaristi ve gezi editörüsün.
                Verilen Japonya mekanı için hem videonun ÜZERİNE gelecek KISA overlay
                metinlerini, hem de Instagram description alanına gelecek UZUN Türkçe
                açıklama metnini üret.

                YANITIN SADECE GEÇERLİ JSON OLSUN. Açıklama, markdown, code fence yasak.

                ÇIKTI ŞEMASI (tüm alanlar zorunlu):
                {
                  "hook": "string",
                  "overlays": [
                    {"saniye": 5.0, "metin": "string", "sure": 3.0,
                     "stil": "baslik", "renk": "sari"}
                  ],
                  "cta": "string",
                  "aciklama": "string",
                  "hashtagler": ["string"]
                }

                KURALLAR:
                - hook: 5-8 kelime. Merak uyandıran, ünlemli, hitap eden Türkçe cümle.
                  Örnekler: "Osaka'daki bu 7/11 sırrını bilen az!",
                  "Kyoto'nun gizli tapınağı", "Bunu Tokyo'da denemeden dönme!".
                - overlays: 3-5 madde. Video üzerinde patlayan KISA yazı (Impact tarzı,
                  büyük, ekranda görünen fact/vurgu). Her metin MAX 4 KELİME.
                  Örnekler: "TAM 500 YIL ÖNCE", "BUNU KAÇIRMA", "ANIME SOKAKLARI",
                  "1000 YEN'E", "SADECE OSAKA'DA".
                - overlays timing: ilk overlay saniye 4-6, sonuncusu (toplam_sure_sn - 6)
                  saniyeden önce olsun. sure: 2.5-4.0 arası.
                - stil: konum → "baslik" (üst), "altbaslik" (alt), "vurgu" (orta).
                - renk: dikkat çekici olsun. Ana vurgu için "sari" veya "kirmizi",
                  destekleyici için "beyaz". Geçerli: "beyaz", "sari", "kirmizi",
                  "yesil", "mavi", "turuncu", "pembe".
                - cta: 3-5 kelime, aksiyon isteyen. Örnek: "Kaydet, Japonya'ya git!",
                  "Takip et, ipuçları gelsin", "Yorum: gitmek ister misin?".
                - aciklama: Instagram description için 3-5 CÜMLE akıcı Türkçe.
                  Mekan hakkında ilginç fact veya turistik ipucu. Emoji kullan (2-4).
                  Videoyu ÖZETLEMEZ, mekana dair bilgi paylaşır. Örnek:
                  "Osaka'daki 7-Eleven'lar sadece market değil 🎌 Bavul emanet
                  hizmeti veren ilk şubeler Osaka Namba'da. 3 saatlik seyahat
                  arası için birebir 💼 Fiyat 700 yen, app'ten rezervasyon var."
                - hashtagler: 8-12 tag, Türkçe + İngilizce karışık. "#" olmadan
                  düz kelime listesi. Örnek: ["japonya","osaka","reels","gezi",
                  "japan","traveltips","7eleven","namba","japonyagezi","seyahat"].

                TON: samimi, meraklandırıcı, "sen" dilinde, 20-35 yaş Türk gezi
                izleyicisine hitap ediyor.
            - id: "b0000000-0000-0000-0000-000000000002"
              role: user
              text: |
                Mekan: {{#start_1.mekan_etiketi#}}
                Toplam reel süresi: {{#start_1.toplam_sure_sn#}} saniye
                Videolar: {{#start_1.video_dosyalari#}}

                Bu mekan için JSON kurgu planını üret. Sadece JSON.
          selected: false
          title: "Kurgu Üretici (qwen2.5)"
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: "llm_1"
        position:
          x: 400
          y: 260
        positionAbsolute:
          x: 400
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 300
      - data:
          desc: "Python tarafı bu değişkeni okur"
          outputs:
            - value_selector:
                - "llm_1"
                - text
              variable: kurgu_json
          selected: false
          title: "End"
          type: end
        height: 90
        id: "end_1"
        position:
          x: 780
          y: 260
        positionAbsolute:
          x: 780
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: "start_1-source-llm_1-target"
        source: "start_1"
        sourceHandle: source
        target: "llm_1"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: "llm_1-source-end_1-target"
        source: "llm_1"
        sourceHandle: source
        target: "end_1"
        targetHandle: target
        type: custom
        zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.9
