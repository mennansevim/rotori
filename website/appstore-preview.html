<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;font-size:12px;opacity:.75;letter-spacing:.4px;pointer-events:auto;z-index:100;user-select:none}
.hint kbd{background:#fff;color:#000;padding:1px 6px;border-radius:4px;font-family:inherit;font-size:11px}
body.play .hint{opacity:0;transition:opacity .4s}
body{display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage{position:relative;width:min(100vw,calc(100vh*9/19.5));height:min(100vh,calc(100vw*19.5/9));max-width:1080px;max-height:1920px;overflow:hidden;background:#050212}
.scene{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;transform:scale(.98)}
.scene svg{width:100%;height:100%;display:block}
body.play .scene{animation:fadeInOut 28s cubic-bezier(.4,0,.2,1) infinite both}
body.play .scene:nth-child(1){animation-delay:0s}
body.play .scene:nth-child(2){animation-delay:4.6s}
body.play .scene:nth-child(3){animation-delay:9.2s}
body.play .scene:nth-child(4){animation-delay:13.8s}
body.play .scene:nth-child(5){animation-delay:18.4s}
body.play .endcard{animation:endShow 28s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes fadeInOut{
0%,1%{opacity:0;transform:scale(.985)}
2.5%,15.5%{opacity:1;transform:scale(1)}
16.5%,100%{opacity:0;transform:scale(1.015)}
}
@keyframes endShow{
0%,80%{opacity:0;transform:scale(.985)}
82%,96%{opacity:1;transform:scale(1)}
98%,100%{opacity:0;transform:scale(1.02)}
}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:radial-gradient(circle at 50% 40%,#2E1966 0%,#0F0524 55%,#04010F 100%);color:#fff;text-align:center;padding:0 40px;gap:24px}
.endcard .mark{font-size:120px;line-height:1;color:#FFC7DB;text-shadow:0 0 40px rgba(255,199,219,.4);font-family:serif;font-weight:700}
.endcard .name{font-size:56px;font-weight:700;letter-spacing:-1px;background:linear-gradient(90deg,#FFC7DB 0%,#B8A8FF 50%,#FFB4C1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.endcard .tag{font-size:22px;color:#D6C8FA;opacity:.85;letter-spacing:.3px}
.endcard .cta{margin-top:20px;font-size:14px;color:#B8A8FF;opacity:.7;letter-spacing:3px}
</style>
</head>

<script>
const body = document.body;
const stage = document.querySelector('.stage');
const hint = document.getElementById('hint');
function play() {
  body.classList.add('play');
  hint.textContent = 'F: Fullscreen · ESC: Çık';
  setTimeout(() => hint.remove(), 3000);
}
body.addEventListener('click', () => { if (!body.classList.contains('play')) play(); });
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) stage.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
